# ── Server ──────────────────────────────────────────────
server.port=8080
spring.profiles.active=dev

# ── MySQL Database ────────────────────────────────────
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/urbanfix?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── JWT ──────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:urbanfix-default-secret-key-change-in-production-min-32-chars}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# ── File Upload ──────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ── Razorpay ──────────────────────────────────────────
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_RJAMPPwg1DCWkn}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# ── CORS ──────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ───────────────────────────────────────────
logging.level.com.urbanfix=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
